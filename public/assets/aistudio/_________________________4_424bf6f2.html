<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>الكتاب الحيّ: الترانزستور</title><meta name="color-scheme" content="light dark">
<style>
:root{--bg:#6b4a2f;--paper:#f6ecd5;--ink:#2e2a24;--mut:#7a6d58;--b:#1f6fb2;--c:#c4452d;--e:#2e8b57;--g:#d89b00;--edge:#d8c7a0;--tab:#e7d6ac}

*{box-sizing:border-box}html,body{height:100%;margin:0}

#stage{height:100%;overflow:auto;padding:14px 12px calc(86px + env(safe-area-inset-bottom)) ;perspective:1500px;display:flex}
.book{margin:auto;width:min(1080px,100%);transform:rotateX(14deg);transform-origin:50% 100%;transform-style:preserve-3d;position:relative}
.spread{display:grid;grid-template-columns:1fr 1fr;background:var(--paper);border-radius:6px;position:relative;
box-shadow:1px 1px 0 var(--edge),2px 2px 0 #cdbb92,3px 3px 0 var(--edge),4px 4px 0 #cdbb92,5px 5px 0 var(--edge),6px 6px 0 #cdbb92,0 28px 40px rgba(0,0,0,.45)}

.card.up{transform:rotateX(-8deg)}

.ctl{margin-top:10px;display:grid;gap:8px}
.ctl label{display:flex;justify-content:space-between;gap:8px;font-size:.9rem;flex-wrap:wrap}
input[type=range]{width:100%;accent-color:var(--c);height:28px}
.btns{display:flex;gap:8px;flex-wrap:wrap}.btn{border:2px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer;min-height:40px}
.btn.on{background:var(--g);color:#222}
.read{display:flex;gap:10px;flex-wrap:wrap;font-size:.9rem}.read span{background:color-mix(in srgb,var(--paper) 85%,var(--ink) 10%);border-radius:6px;padding:2px 8px}
.stars{font-size:2rem;color:var(--g);letter-spacing:4px;min-height:2.6rem}
nav{position:fixed;inset:auto 0 0 0;display:flex;justify-content:center;align-items:center;gap:8px;padding:10px 10px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.55) 40%);z-index:5;flex-wrap:wrap}
nav .btn{min-width:44px;background:var(--paper)}#dots{color:#fff;min-width:64px;text-align:center}
.teach .pageA{display:none}.teach .spread{grid-template-columns:1fr}.teach .pop{max-width:760px}.teach .spread::after{display:none}.teach .ctl{font-size:1.15rem}
@media(max-width:820px){.spread{grid-template-columns:1fr}.spread::after{display:none}.book{transform:rotateX(5deg)}.page{padding:16px 16px;min-height:0}#stage{display:block}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.card{background:none;border:0}

.in{position:absolute;inset:0;transform-style:preserve-3d}.in>i{position:absolute;display:block;text-align:center;line-height:1.2}
.cb,.pad{animation:drop .7s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(var(--i,0)*80ms)}

.mat{--k:0;--f:0;cursor:grab;touch-action:pan-y;user-select:none}.mat.drag{cursor:grabbing}
.sw{position:absolute;inset:0;transform-style:preserve-3d;animation:sway 9s ease-in-out infinite alternate}

.rl{transition:background .25s}.on .rl{background:#4d7dff!important}.on .relay{animation:clk .3s}

.t{transition:opacity .4s}.on .t{opacity:1}

.on .t.h.r,.on .t.h.l{background-size:14px 5px}.on .t.v.u,.on .t.v.d{background-size:5px 14px}
.on .t{animation-duration:calc(1.5s - 1.2s*var(--f));animation-timing-function:linear;animation-iteration-count:infinite}

.teach .mat{height:min(520px,68vh)}.teach .board{scale:1.5}
.fan,.pu{display:inline-block}.on .fan{animation:spn calc(1.2s - .9s*var(--f)) linear infinite}@keyframes spn{to{transform:rotate(360deg)}}

.t.dv{--tc:#ff9a3c}.div .t.dv{box-shadow:0 0 7px var(--tc);background-image:repeating-linear-gradient(0deg,var(--tc) 0 7px,transparent 7px 14px);background-size:5px 14px;animation:fd .6s linear infinite}
.t.q{box-shadow:none!important;background-image:none!important;animation:none!important}
.dm{transition:background .4s,box-shadow .4s}.div .dm{background:#ff7a2a!important;box-shadow:0 0 28px 8px rgba(255,122,42,.7)}
.sol .ib b{height:calc(var(--vb,0)*100%)}
.trl{position:absolute;inset:0;transform-style:preserve-3d}

.ct{color:#fff;background:rgba(0,0,0,.45);padding:0 3px;border-radius:3px;font-size:8px}
.stt{position:absolute;inset:auto 0 6px;text-align:center;color:#fff;font-size:.85rem;text-shadow:0 1px 3px #000}
.cb.lv{animation:none;transform:rotateZ(30deg);transform-origin:0 50%;transition:transform .6s cubic-bezier(.3,1.5,.5,1)}.dvt .cb.lv{transform:rotateZ(-30deg)}
.t.sn{--tc:#5ab0ff}.sol .t.sp.r{box-shadow:0 0 7px var(--tc);background-image:repeating-linear-gradient(90deg,var(--tc) 0 7px,transparent 7px 14px);background-size:14px 5px;animation:fr .9s linear infinite}
.sol .t.sn.l{box-shadow:0 0 6px var(--tc);background-image:repeating-linear-gradient(90deg,var(--tc) 0 7px,transparent 7px 14px);background-size:14px 5px;animation:fl 1.4s linear infinite}
.sol .t.sn.u{box-shadow:0 0 6px var(--tc);background-image:repeating-linear-gradient(0deg,var(--tc) 0 7px,transparent 7px 14px);background-size:5px 14px;animation:fu 1.4s linear infinite}
.div .t.dv.h{background-image:repeating-linear-gradient(90deg,var(--tc) 0 7px,transparent 7px 14px);background-size:14px 5px;animation:fr .6s linear infinite}
.nod .dmw{opacity:.3}.sa{font-family:inherit;direction:rtl;font-size:9px}.sol .ib{display:none}
.gg{margin:10px 6px 0;direction:ltr}.gb{position:relative;height:14px;border-radius:7px;background:linear-gradient(90deg,#3c8d5a 0 42.86%,#d8b24a 42.86% 77.14%,#d9654b 77.14%)}.gb .mk{position:absolute;top:-4px;left:50%;width:6px;height:22px;background:#fff;border:1px solid #000;border-radius:3px;transform:translateX(-3px);transition:left .3s}

.pad.stg{animation:none}

<script>
const $=s=>document.querySelector(s),N=(v,u)=>`<bdi dir="ltr">${v}${u?' '+u:''}</bdi>`;
const VS=9,VLED=2,R=220,VBE=0.6,IMAX=(VS-VLED)/R*1000; // mA
let cur=0,mute=false,AC;
function flip(){if(mute)return;try{AC=AC||new AudioContext();const n=AC.sampleRate*.13,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);
for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3)*.25;const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=1800;s.connect(f).connect(AC.destination);s.start()}catch(e){}}

function cube(x,y,w,d,h,col,txt='',tc='#fff',fs=9,cls='',ccls='',bcls=''){return `<div class="cb ${bcls}" style="left:${x}px;top:${y}px;width:${w}px;height:${d}px"><div class="in ${ccls}"><i class="${cls}" style="inset:0;transform:translateZ(${h}px);background:${col};color:${tc};font:700 ${fs}px sans-serif;display:flex;align-items:center;justify-content:center">${txt}</i><i style="left:0;top:${d}px;width:${w}px;height:${h}px;transform-origin:top;transform:rotateX(90deg);background:color-mix(in srgb,${col} 72%,#000)"></i><i style="left:${w}px;top:0;width:${h}px;height:${d}px;transform-origin:left;transform:rotateY(-90deg);background:color-mix(in srgb,${col} 50%,#000)"></i></div></div>`}
function circuit(type,mode){const pn=type=='NPN'?'BC337-40':'BC327-40';
 const led=cube(215,22,20,20,22,'#4a3c14','','#fff',9,'led')+cube(150,28,46,10,10,'#e8d9b0','')+'<span class="s" style="left:152px;top:44px">R2 220Ω</span><span class="s" style="left:208px;top:48px">LED</span>';
 const load={L:led,T:led+'<i class="pad" style="left:26px;top:168px;background:#e3b341"></i>',D:led+cube(22,146,24,24,8,'#c9a063','LDR','#222',8),
 R:cube(172,8,96,66,60,'#1f4fd8','SONGLE<br>SRD-12VDC','#fff',9,'rl','relay')+cube(226,88,36,10,10,'#1a1a1a','')+'<b class="band" style="left:232px;top:88px"></b><span class="s" style="left:228px;top:102px">D1</span><span class="s" style="left:174px;top:78px">K1</span>',
 M:cube(190,10,64,40,34,'#8a8f98','<span class="fan">✢</span>','#222',22)+'<span class="s" style="left:196px;top:54px">M</span>',
 P:cube(196,8,56,56,22,'#2a2a2a','<span class="pu">◉</span>','#9ad',22)+'<span class="s" style="left:200px;top:68px">HP</span>',
 S:cube(150,22,60,14,14,'#e8d9b0','')+'<span class="s" style="left:152px;top:42px">RL 22kΩ</span>'}[mode];
 const T=(c,d,x,y,w,h)=>`<div class="t ${c} ${d}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px"></div>`;
 return `<div class="mat"><div class="sw"><div class="board">
 ${T('sp h','r',52,31,120,5)}${T('c v','d',200,44,5,100)}${T('c h','l',160,142,45,5)}${T('e h','l',26,142,104,5)}${T('e v','u',26,70,5,77)}${T('b v','u',141,138,5,36)}${T('b h','r',16,170,130,5)}
 ${cube(8,16,44,54,26,'#1f8a4c','','#fff',12,'tb')}${load}
 ${cube(118,92,50,26,56,'#141414',pn,'#ececec',10)}
 ${cube(127,118,4,20,5,'#d0d0d0')}${cube(142,118,4,20,5,'#d0d0d0')}${cube(157,118,4,20,5,'#d0d0d0')}
 <i class="pad" style="left:125px;top:139px"></i><i class="pad" style="left:140px;top:139px"></i><i class="pad" style="left:155px;top:139px"></i>
 ${cube(70,165,46,10,10,'#e8d9b0','')}<i class="pad" style="left:8px;top:168px;background:#e3b341"></i>
 <span class="s" style="left:126px;top:152px;color:#6fe39a;font-size:11px">E</span><span class="s" style="left:141px;top:152px;color:#5ab0ff;font-size:11px">B</span><span class="s" style="left:156px;top:152px;color:#ff6b5a;font-size:11px">C</span>
 <span class="s" style="left:172px;top:100px">Q1</span><span class="s" style="left:74px;top:179px">${mode=='S'?'RB 2.2MΩ':'R1'}</span><span class="s" dir="rtl" style="left:4px;top:179px;font-family:inherit">${mode=='S'?'':'إصبع'}</span><span class="s" style="left:196px;top:176px">${mode=='S'?'5V':'12V REV A'}</span></div></div>
 <div class="ib"><b></b></div><div class="vl"></div><div class="st"></div></div>`}
function attachDrag(m){let x,y,rz=-14,rx=54,d=0;m.onpointerdown=e=>{d=1;x=e.clientX;y=e.clientY;m.setPointerCapture(e.pointerId);m.classList.add('drag')};
m.onpointermove=e=>{if(!d)return;rz+=(e.clientX-x)*.4;rx=Math.max(30,Math.min(72,rx-(e.clientY-y)*.3));x=e.clientX;y=e.clientY;m.style.setProperty('--rx',rx+'deg');m.style.setProperty('--rz',rz+'deg')};
m.onpointerup=m.onpointercancel=()=>{d=0;m.classList.remove('drag')}}
function draw(c,type,rev,k,ic,mode='L',vc){const sig=type+mode;
 if(c.dataset.sig!=sig){c.innerHTML=circuit(type,mode);c.dataset.sig=sig;c.querySelectorAll('.cb,.pad').forEach((e,i)=>e.style.setProperty('--i',i));attachDrag(c.querySelector('.mat'))}
 const m=c.querySelector('.mat'),on=ic>0,S=mode=='S',f=Math.min(1,ic/(S?.227:IMAX));m.style.setProperty('--k',k);m.style.setProperty('--f',f);m.style.setProperty('--fb',on?.35+.5*f:0);m.classList.toggle('on',on);
 c.querySelector('.tb').innerHTML=rev?'−&nbsp;&nbsp;+':'+&nbsp;&nbsp;−';
 const vbe=on?VBE:0,ledm='LTD'.includes(mode),vce=S?vc:!on?VS:ledm?Math.max(.2,VS-VLED-ic*R/1000):.2;
 c.querySelector('.vl').innerHTML=`<span style="color:#5ab0ff">V<sub>BE</sub> ${N(vbe.toFixed(1),'V')}</span><span style="color:#ff6b5a">V<sub>CE</sub> ${N(vce.toFixed(S?2:1),'V')}</span>`+(S?`<span style="color:#ffd24a">الهدف ${N('2.5 V')}</span>`:'');

 const m=c.querySelector('.mat'),g=[1,2,3].map(k=>Math.pow(BETA,k)*ibUA/1000),ic=Math.min(g[n-1],IMAX);
 if(+c.dataset.n!=n){c.dataset.n=n;

  XS.slice(0,n).forEach((x,i)=>h+=T('c v','d',x+27,60,5,84,`--s:${i+1}`));

  h+=T('e v','d',L+1,139,5,42,`--s:${n}`)+T('e h','l',26,176,L-20,5,`--s:${n}`)+T('e v','u',26,70,5,111,`--s:${n}`);
  c.querySelector('.trl').innerHTML=h;
  c.querySelectorAll('.stg').forEach(e=>{const k=+e.dataset.k;if(k)e.classList.toggle('off',k>n)})}
 m.classList.add('on');m.style.setProperty('--k',ic/IMAX);
 c.querySelectorAll('.trl .t').forEach(t=>{const sI=+(t.style.getPropertyValue('--s')||0);t.style.setProperty('--f',sI?Math.min(1,g[Math.min(sI,n)-1]/IMAX):Math.min(1,.25+ibUA/60))});
 c.querySelectorAll('.ct').forEach(e=>{const k=+e.dataset.k;e.textContent=k<=n?`Q${k}: ${g[k-1]>IMAX?'≥ '+IMAX.toFixed(1)+' mA':fmtI(g[k-1]).replace(/<[^>]+>/g,'')}`:'';e.classList.toggle('off',k>n)});
 c.querySelector('.vl').innerHTML=`<span style="color:#5ab0ff">I<sub>B</sub> ${N(ibUA.toFixed(1),'µA')}</span><span style="color:#ff6b5a">β<sub>كلي</sub> ${N(Math.pow(BETA,n).toLocaleString('en'))}</span>`;
 c.querySelector('.stt').textContent=n+' ترانزستور · I_C = '+(g[n-1]>IMAX?IMAX.toFixed(1)+' mA (حدّ الحِمل)':ic.toFixed(2)+' mA')}

{t:'الفصل ١ — كيف يضيء إصبعٌ مصباحاً؟',
A:()=>`<div class="chap">ص ٣ و ٢٧ من الكتاب</div><h2>إصبعك مفتاح!</h2>
<p>تلمس سلكين فيضيء الـ ${N('LED')} ويزداد سطوعه كلما ضغطتَ أقوى. تيار صغير في القاعدة ${'<span class="k-b">B</span>'} يتحكم بتيار أكبر بين المجمّع <span class="k-c">C</span> والباعث <span class="k-e">E</span>.</p>

<div class="note">ملاحظة: الترانزستور لا «يُشغَّل» بالجهد وحده، بل بتيار يدخل القاعدة. في الكتاب (ص٥٠): كاشف الكذب، كلما ضغطتَ أقوى أضاءت LEDs أكثر.</div>`,
B:()=>`<div class="pop"><div class="card"></div></div><div class="ctl"><label>قوة الضغط <input id="s1" type="range" min="0" max="100" value="10"></label><div class="read" id="r1"></div></div>`,

r.innerHTML=`<span>R إصبع ${N((v.Rf/1000).toFixed(0),'kΩ')}</span><span>I<sub>B</sub> ${N(v.Ib.toFixed(1),'µA')}</span><span>I<sub>C</sub> ${N(v.Ic.toFixed(2),'mA')}</span><span>I<sub>max</sub> ${N(IMAX.toFixed(1),'mA')}</span>`};s.oninput=f;f()}},

A:()=>`<div class="chap">ص ١ و ٢١–٢٤</div><h2>النوعان ولا لَبس</h2>

A:()=>`<div class="chap">ص ٢٤ و ٢٨</div><h2>تضخيم فوق تضخيم</h2>

B:()=>`<div class="pop"><div class="card"></div></div><div class="ctl"><div class="btns"><button class="btn on" data-n="1">١ ترانزستور</button><button class="btn" data-n="2">٢</button><button class="btn" data-n="3">٣</button></div><label>قوة اللمس <input id="s4" type="range" min="0" max="100" value="0"></label><div class="read" id="r4"></div></div>`,

A:()=>`<div class="chap">فهرس الكتاب وص ٥٠</div><h2>مفتاح أو مضخّم</h2>
<p>في دارات الكتاب يعمل الترانزستور مفتاحاً (تيار القاعدة يفتح الحمل أو يغلقه) أو مضخّماً (إشارة صغيرة تصير كبيرة). أمثلة من الفهرس: Touch Switch وDark Detector وMotor Speed Controller وH-Bridge وAudio Amplifier.</p>
<div class="law">I<sub>B</sub> = (V<sub>in</sub> − V<sub>BE</sub>) / R<sub>B</sub></div>
<p>مثال ص٥٠ (مفتاح اللمس): مقاومة الجلد تمرّر تياراً صغيراً إلى الزوج الفائق فيشغّل ترانزستور BC557، ثم تُبقي المقاومة ${N('4M7')} الدارة شغّالة. ولإطفائها يُلمس لوحا OFF.</p>
${qa(`جهد الدخل ${N("0.4 V")} فقط عبر ${N("10 kΩ")}. هل يدور المحرك؟`,`لا. تحت ${N("0.6 V")} لا يدخل تيار القاعدة، فيبقى I<sub>C</sub> صفراً.`)}
<div class="note">تنبيه: عروض المختبر تبيّن المبدأ نفسه لكل حِمل؛ أسماء الأمثلة من فهرس الكتاب وقيم الحمل ليست من الكتاب، واللمس هنا يُمثَّل بجهد على منزلق وليس دارة ص٥٠ كاملة.</div>`,
B:()=>`<div class="pop"><div class="card"></div></div><div class="ctl"><div class="btns"><button class="btn on" data-u="0">مفتاح لمس</button><button class="btn" data-u="1">كاشف الظلام</button><button class="btn" data-u="2">محرك</button><button class="btn" data-u="3">مكبّر صوت</button><button class="btn" data-u="4">مرحّل</button></div><label><span>V<sub>in</sub></span> <input id="s5" type="range" min="0" max="30" value="3"></label><div class="read" id="r5"></div></div>`,

A:()=>`<div class="chap">ص ١٨</div><h2>متى يتوقف الشحن؟</h2>

<p>المقاومة المتغيّرة تضبط ${N('13.7 V')} الذي يسقط عنده المرحّل. ويعود الشحن عند نحو ${N('12.5 V')}.</p>

${qa(`وصل جهد البطارية إلى ${N('13.7 V')}. هل يستمر الشحن؟ وإذا نزل الجهد إلى ${N('13 V')} هل يعود؟`,`لا يستمر. ولا يعود عند ${N('13 V')} بل عند نحو ${N('12.5 V')} فقط (ص١٨). جرّب المنزلق صعوداً ثم نزولاً.`)}

{t:'الفصل ٦ — تحدّي نصف الجهد',
A:()=>`<div class="chap">ص ٣ — التحيّز الذاتي</div><h2>اضبط المجمّع على النصف</h2>
<p>في مرحلة الباعث المشترك نختار مقاومة القاعدة <b>R<sub>B</sub></b> حتى يصير جهد المجمّع نصف جهد المصدر: ${N('2.5 V')} من ${N('5 V')} مع حِمل ${N('22 kΩ')}.</p>
<div class="law">V<sub>C</sub> = V<sub>CC</sub> − I<sub>C</sub> × R<sub>L</sub></div>
<p>الكتاب يقول إن R<sub>B</sub> قرابة ${N('2.2 MΩ')} (ص٣).</p>
${qa('كلما صغّرتَ R<sub>B</sub> ماذا يفعل جهد المجمّع؟',`يزداد تيار القاعدة والمجمّع فيهبط V<sub>C</sub>. وبـ R<sub>B</sub> كبيرة جداً يقترب V<sub>C</sub> من ${N('5 V')}.`)}
<div class="note">تنبيه للمعلم: الكتاب لا يحدد β ولا V<sub>BE</sub> هنا؛ استعملنا ${N('β = 57')} و${N('0.6 V')} لتطابق ${N('2.2 MΩ')}.</div>`,
B:()=>`<div class="pop"><div class="card"></div></div><div class="ctl"><label><span>R<sub>B</sub></span> <input id="s3" type="range" min="0" max="100" value="30"></label><div class="read" id="r3"></div><div class="btns"><button class="btn" id="ck">تحقّق ✓</button></div><div class="stars" id="st"></div></div>`,
init(el){const s=el.querySelector('#s3'),r=el.querySelector('#r3'),g=el.querySelector('.card'),st=el.querySelector('#st');
const calc=()=>{const Rb=1e5*Math.pow(100,s.value/100),Ib=(5-VBE)/Rb,Ic=Math.min(57*Ib,5/22000),Vc=Math.max(.2,5-Ic*22000);return{Rb,Ib:Ib*1e6,Ic:Ic*1e6,Vc}};
const f=()=>{const v=calc();draw(g,'NPN',0,0,v.Ic/1000,'S',v.Vc);
r.innerHTML=`<span>R<sub>B</sub> ${N(v.Rb>=1e6?(v.Rb/1e6).toFixed(2)+' MΩ':(v.Rb/1e3).toFixed(0)+' kΩ')}</span><span>I<sub>B</sub> ${N(v.Ib.toFixed(2),'µA')}</span><span>I<sub>C</sub> ${N(v.Ic.toFixed(0),'µA')}</span><span>V<sub>C</sub> ${N(v.Vc.toFixed(2),'V')}</span>`;st.textContent=''};
el.querySelector('#ck').onclick=()=>{const d=Math.abs(calc().Vc-2.5),n=d<.1?3:d<.3?2:d<.6?1:0;st.innerHTML=('★'.repeat(n)+'☆'.repeat(3-n))+`<div style="font-size:.9rem">${n==3?'ممتاز! V<sub>C</sub> قرب النصف.':'اقترب من '+N('2.5 V')+' وأعد المحاولة.'}</div>`};
s.oninput=f;f()}}
];
function show(i,anim=true){const prev=cur;cur=Math.max(0,Math.min(CH.length-1,i));const sp=$('#sp'),c=CH[cur];
sp.innerHTML=`<section class="page pageA">${c.A()}</section><section class="page pageB"><div class="chap">${c.t}</div>${c.B()}</section>`;
c.init(sp.querySelector('.pageB'));setup(sp.querySelector('.pageB'));
if(anim){sp.classList.remove('turn');void sp.offsetWidth;sp.classList.add('turn');flip();if(innerWidth>820&&!document.body.classList.contains('teach')){const l=document.createElement('div');l.className='leaf '+(cur>=prev?'fw':'bw');sp.appendChild(l);l.onanimationend=()=>l.remove()}}
$('#dots').innerHTML=N((cur+1)+' / '+CH.length);$('#pv').disabled=cur==0;$('#nx').disabled=cur==CH.length-1;$('#stage').scrollTo(0,0)}
$('#nx').onclick=()=>show(cur+1);$('#pv').onclick=()=>show(cur-1);
$('#tm').onclick=e=>{document.body.classList.toggle('teach');e.target.classList.toggle('on')};
$('#mu').onclick=e=>{mute=!mute;e.target.textContent=mute?'🔇':'🔊'};
addEventListener('keydown',e=>{if(e.key=='ArrowLeft')show(cur+1);if(e.key=='ArrowRight')show(cur-1)});
let x0;addEventListener('touchstart',e=>x0=e.touches[0].clientX,{passive:true});
addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-x0;if(Math.abs(d)>70&&!e.target.closest('input,.mat'))show(cur+(d<0?1:-1))},{passive:true});
show(0,false);
</script></body></html>
